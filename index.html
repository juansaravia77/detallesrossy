<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Detalles Rossy - Flores y Peluches</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9F6F0;
            color: #2C2A29;
            scroll-behavior: smooth;
        }

        /* PALETA VERDE ELEGANTE */
        :root {
            --green-deep: #2A5C4A;
            --green-moss: #417B5E;
            --gold-accent: #C6A15B;
            --gold-soft: #D9B87A;
            --sand-light: #F0EBE1;
            --cream-pure: #FEFCF8;
            --charcoal-soft: #3B3A38;
            --shadow-sm: 0 5px 15px rgba(0, 0, 0, 0.03), 0 2px 5px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 20px 30px -12px rgba(0, 0, 0, 0.12);
            --sold-bg: #B23A3A;
            --sold-text: #FFFFFF;
        }

        /* BANNER PRINCIPAL */
        .banner-container {
            width: 100%;
            background: #FDF9F2;
        }
        .main-banner {
            width: 100%;
            display: block;
            object-fit: cover;
            max-height: 480px;
        }
        @media (max-width: 768px) {
            .main-banner {
                max-height: 320px;
                object-fit: cover;
            }
        }

        /* Botones de categoría */
        .categories {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin: 2rem 1rem 1.8rem 1rem;
        }

        .cat-btn {
            background: white;
            border: 1px solid #DCCFBF;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #5B5447;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .cat-btn i {
            margin-right: 0.5rem;
            color: var(--gold-accent);
        }

        .cat-btn.active {
            background: var(--green-deep);
            border-color: var(--green-deep);
            color: white;
        }

        .cat-btn.active i {
            color: white;
        }

        .cat-btn:hover:not(.active) {
            background: #F6F0E8;
            border-color: #CBBFAE;
        }

        /* Catálogo grilla */
        .catalog {
            max-width: 1300px;
            margin: 1rem auto 3rem;
            padding: 0 1.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        /* TARJETAS */
        .card {
            background: var(--cream-pure);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            border: 1px solid #EBE3D8;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: #DFD2C2;
        }

        /* Contenedor de imagen con posición relativa para la etiqueta sold */
        .card-img-wrapper {
            position: relative;
            overflow: hidden;
        }

        .card-img {
            height: 320px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .card-img:hover {
            opacity: 0.92;
        }

        /* Indicador de lupa */
        .card-img-wrapper .zoom-icon {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0,0,0,0.5);
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .card-img-wrapper:hover .zoom-icon {
            opacity: 1;
        }

        /* ETIQUETA DE VENDIDO */
        .sold-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--sold-bg);
            color: var(--sold-text);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            backdrop-filter: blur(2px);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sold-badge i {
            font-size: 1rem;
        }

        /* Efecto de opacidad en la imagen para productos vendidos */
        .card-img.sold {
            opacity: 0.85;
        }

        .card-content {
            padding: 0.85rem 1rem 1rem 1rem;
            border-top: 1px solid #F0E8DF;
            background: white;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            color: #2D3A2F;
            margin-bottom: 0.25rem;
            line-height: 1.3;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        /* Pequeña etiqueta de vendido en el título (versión móvil alternativa) */
        .title-sold-badge {
            background: var(--sold-bg);
            color: var(--sold-text);
            font-size: 0.6rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-transform: uppercase;
        }

        .card-desc {
            font-size: 0.75rem;
            color: #7C7669;
            margin: 0.3rem 0 0.5rem 0;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--green-deep);
            margin-top: 0.25rem;
            display: inline-block;
            background: #F4EFE7;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            letter-spacing: -0.2px;
        }

        /* LIGHTBOX / MODAL */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-img {
            max-width: 90%;
            max-height: 85%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            animation: zoomIn 0.25s ease-out;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.95);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(0,0,0,0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-close:hover {
            color: #C6A15B;
            transform: scale(1.1);
        }

        .lightbox-caption {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 1rem;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            margin: 0 auto;
            width: fit-content;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }

        /* Footer */
        footer {
            background: #E9E1D6;
            text-align: center;
            padding: 2rem 1rem;
            margin-top: 3rem;
            border-top-left-radius: 1.5rem;
            border-top-right-radius: 1.5rem;
            font-size: 0.8rem;
            color: #5C5547;
        }

        .heart-icon {
            color: #b17f4b;
            display: inline-block;
            animation: gentlePulse 1.6s infinite;
        }

        @keyframes gentlePulse {
            0% { transform: scale(1);}
            50% { transform: scale(1.08);}
            100% { transform: scale(1);}
        }

        /* Toast */
        .toast-msg {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) scale(0.95);
            background: #2C3E2Bdd;
            backdrop-filter: blur(10px);
            color: #FEF6E6;
            padding: 0.7rem 1.6rem;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.8rem;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
            white-space: nowrap;
            font-family: 'Inter', monospace;
            border: 1px solid #CBAA7A;
        }

        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        @media (max-width: 640px) {
            .grid {
                gap: 1.2rem;
            }
            .card-img {
                height: 260px;
            }
            .toast-msg {
                white-space: normal;
                text-align: center;
                max-width: 85%;
                font-size: 0.75rem;
            }
            .categories {
                gap: 0.6rem;
            }
            .cat-btn {
                padding: 0.4rem 1rem;
                font-size: 0.75rem;
            }
            .card-content {
                padding: 0.7rem 0.9rem 0.9rem 0.9rem;
            }
            .card-title {
                font-size: 1rem;
            }
            .price {
                font-size: 1rem;
                padding: 0.15rem 0.7rem;
            }
            .lightbox-close {
                top: 10px;
                right: 15px;
                width: 40px;
                height: 40px;
                font-size: 30px;
            }
            .lightbox-caption {
                font-size: 0.8rem;
                bottom: 15px;
            }
            .sold-badge {
                padding: 0.5rem 0.8rem;
                font-size: 1rem;
                top: 8px;
                right: 8px;
            }
        }

        @media (min-width: 1400px) {
            .card-img {
                height: 360px;
            }
        }

        .floral-bg {
            background-image: radial-gradient(#DCCFBF 0.8px, transparent 0.8px);
            background-size: 22px 22px;
        }
    </style>
</head>
<body>

<!-- BANNER PRINCIPAL -->
<div class="banner-container">
    <img class="main-banner" src="img/banner.png" alt="Detalles Rossy - Te Amo Mamá" loading="eager">
</div>

<!-- Filtros -->
<div class="categories">
    <button class="cat-btn active" data-filter="all"><i class="fas fa-seedling"></i> Todos</button>
    <button class="cat-btn" data-filter="flower"><i class="fas fa-flower"></i> Ramos de Flores</button>
    <button class="cat-btn" data-filter="plush"><i class="fas fa-bear"></i> Peluches</button>
    <button class="cat-btn" data-filter="combo"><i class="fas fa-gift"></i> Combos Especiales</button>
</div>

<!-- Catálogo dinámico -->
<section class="catalog">
    <div class="grid" id="catalog-grid"></div>
</section>

<footer>
    <p>Con <span class="heart-icon">🌿</span> dedicación y calidez • Detalles Rossy para Trinidad</p>
    <p style="margin-top: 0.5rem; font-size: 0.7rem;">Flores de limpia pipa & peluches suaves | Entrega con amor</p>
</footer>

<div id="toastMsg" class="toast-msg">✨ agregado con cariño a tu lista de deseos ✨</div>

<!-- LIGHTBOX MODAL -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
    <img id="lightbox-img" class="lightbox-img" alt="Vista ampliada">
    <div id="lightbox-caption" class="lightbox-caption"></div>
</div>

<script>
    // Catálogo de productos
    // El producto con id 1 (Ternura) tiene la propiedad "sold: true"
    const products = [
	{ id: 1, name: "Ternura", desc: "Peluche Tierno que conquista de 15cm, con flores de limpia pipa.", price: "Bs. 80", category: "plush", img: "img/peluche1.png", sold: false },
        { id: 2, name: "Rosa", desc: "Peluche rosa suave, con flores de limpia pipa.", price: "Bs. 80", category: "plush", img: "img/peluche2.png", sold: true },
        { id: 3, name: "Osito", desc: "Peluche suave, con corazón y flores de limpia pipa.", price: "Bs. 120", category: "plush", img: "img/peluche3.png", sold: false },
        { id: 4, name: "Osito Miel", desc: "Peluche suave, con corazón y flores de limpia pipa.", price: "Bs. 120", category: "plush", img: "img/peluche4.png", sold: false },
        { id: 5, name: "Perrito Nube", desc: "Peluche suave, con flores de limpia pipa.", price: "Bs. 120", category: "plush", img: "img/peluche5.png", sold: false },
        { id: 6, name: "Osito Corazón", desc: "Peluche suave, con corazón y flores de limpia pipa.", price: "Bs. 120", category: "plush", img: "img/peluche6.png", sold: false },
        { id: 7, name: "Lobito", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 150", category: "combo", img: "img/peluche7.png", sold: false },
        { id: 8, name: "Lotso", desc: "Flor de pipa lotso el oso", price: "Bs. 35", category: "flower", img: "img/peluche8.png", sold: true },
        { id: 9, name: "Poo", desc: "Flor de pipa osito poo", price: "Bs. 35", category: "flower", img: "img/peluche9.png", sold: true },
        { id: 10, name: "Puerquito", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 150", category: "combo", img: "img/peluche10.png", sold: false },
        { id: 11, name: "Panda", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 120", category: "flower", img: "img/peluche11.png", sold: false },
		{ id: 12, name: "Oso Pooh", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 25", category: "flower", img: "img/peluche12.png", sold: false },
		{ id: 13, name: "Conejito", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 80", category: "flower", img: "img/peluche13.png", sold: false },
		{ id: 14, name: "Oso Marron", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 25", category: "flower", img: "img/peluche14.png", sold: false },
		{ id: 15, name: "Oso Celeste", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 25", category: "flower", img: "img/peluche15.png", sold: false },		
		{ id: 16, name: "Perrito", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 80", category: "flower", img: "img/peluche16.png", sold: false },
		{ id: 17, name: "Patito", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 100", category: "flower", img: "img/peluche17.png", sold: false },
		{ id: 18, name: "Lotso", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 25", category: "flower", img: "img/peluche18.png", sold: false },
		{ id: 19, name: "Osito Flor", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 25", category: "flower", img: "img/peluche19.png", sold: false },
		{ id: 20, name: "Lobito", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 150", category: "flower", img: "img/peluche20.png", sold: false },
		{ id: 21, name: "Unicornio", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 120", category: "flower", img: "img/peluche21.png", sold: false },
		{ id: 22, name: "Osito Ternura", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 120", category: "flower", img: "img/peluche22.png", sold: false },
		{ id: 23, name: "Osito Polar", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 80", category: "flower", img: "img/peluche23.png", sold: false },
		{ id: 24, name: "Oso Tres", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 25", category: "flower", img: "img/peluche24.png", sold: false },
		{ id: 25, name: "Unicornio Dos", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 80", category: "flower", img: "img/peluche25.png", sold: false },
		{ id: 27, name: "Conejito Tierno", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 90", category: "flower", img: "img/peluche27.png", sold: false },
		{ id: 28, name: "Perrita Tierna", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 80", category: "flower", img: "img/peluche28.png", sold: false },
		{ id: 29, name: "Panda Lila", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 80", category: "plush", img: "img/peluche29.png", sold: false },
		{ id: 30, name: "Osito Grande", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 150", category: "plush", img: "img/peluche30.png", sold: false },
		{ id: 31, name: "Osito Love", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 150", category: "plush", img: "img/peluche31.png", sold: false },
		{ id: 32, name: "Osito Blanco", desc: "Peluche suave y flores de limpia pipa.", price: "Bs. 150", category: "plush", img: "img/peluche32.png", sold: false }
    ];

    const gridContainer = document.getElementById('catalog-grid');
    let activeFilter = 'all';

    // Lightbox functions
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');

    function openLightbox(imageUrl, productName) {
        lightboxImg.src = imageUrl;
        lightboxCaption.textContent = productName;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && lightbox.classList.contains('active')) {
            closeLightbox();
        }
    });

    function renderCatalog(filter = 'all') {
        let filtered = filter === 'all' ? [...products] : products.filter(p => p.category === filter);

        if (filtered.length === 0) {
            gridContainer.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:2.5rem; background:#F4EFE7; border-radius:2rem;"><i class="fas fa-heart-broken" style="font-size:2.2rem; color:#B28B60;"></i><p style="margin-top:1rem;">Muy pronto nuevos regalos llenos de ternura 💚</p></div>`;
            return;
        }

        let html = '';
        for (let product of filtered) {
            // Determinar si el producto está vendido
            const isSold = product.sold === true;
            const soldClass = isSold ? 'sold' : '';
            const soldBadge = isSold ? `
                <div class="sold-badge">
                    <i class="fas fa-check-circle"></i> VENDIDO
                </div>
            ` : '';
            
            // Pequeña etiqueta en el título para móviles o refuerzo visual
            const titleSoldBadge = isSold ? `<span class="title-sold-badge"><i class="fas fa-check-circle"></i> Vendido</span>` : '';
            
            // Para el lightbox, mostramos el nombre + precio + indicación de vendido si aplica
            const lightboxTitle = isSold ? `${product.name} - ${product.price} (VENDIDO)` : `${product.name} - ${product.price}`;
            
            html += `
                <div class="card" data-id="${product.id}">
                    <div class="card-img-wrapper">
                        <div class="card-img ${soldClass}" style="background-image: url('${product.img}'); background-size: cover; background-position: center;" 
                             onclick="openLightbox('${product.img}', '${lightboxTitle.replace(/'/g, "\\'")}')">
                        </div>
                        <div class="zoom-icon">🔍</div>
                        ${soldBadge}
                    </div>
                    <div class="card-content">
                        <div class="card-title">
                            ${product.name} - ${product.price}
                            ${titleSoldBadge}
                        </div>
                        <div class="card-desc">${product.desc}</div>
                    </div>
                </div>
            `;
        }
        gridContainer.innerHTML = html;
    }

    // Filtros
    const filterBtns = document.querySelectorAll('.cat-btn');
    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const filterValue = btn.getAttribute('data-filter');
            activeFilter = filterValue;
            filterBtns.forEach(bt => bt.classList.remove('active'));
            btn.classList.add('active');
            renderCatalog(activeFilter);
        });
    });

    // Inicializar
    renderCatalog('all');

    // Animación escalonada
    const styleAnim = document.createElement('style');
    styleAnim.textContent = `
        .card {
            animation: softRise 0.4s ease-out backwards;
            animation-delay: calc(0.02s * var(--order, 0));
        }
        @keyframes softRise {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    `;
    document.head.appendChild(styleAnim);
    
    function applyCardDelay() {
        const cards = document.querySelectorAll('.card');
        cards.forEach((card, idx) => card.style.setProperty('--order', idx));
    }
    
    const observer = new MutationObserver(() => applyCardDelay());
    observer.observe(gridContainer, { childList: true, subtree: false });
    applyCardDelay();

    console.log("%c🌿 Detalles Rossy · Etiqueta VENDIDO añadida al producto Ternura 🌿", "color: #2A5C4A; font-size: 13px; font-weight: bold;");
</script>
</body>
</html>
